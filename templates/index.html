<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drone-Bird Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="app">
      <nav class="navbar">
        <div class="logo">AvianDroneSense: Hybrid Detection for Sky Surveillance</div>
        <div class="nav-links">
          <a href="{{ url_for('index') }}" class="nav-link active" data-tab="home">Home</a>
          <a href="{{ url_for('about') }}" class="nav-link" data-tab="about">About</a>
          <a href="{{ url_for('people') }}" class="nav-link" data-tab="people">People</a>
        </div>
      </nav>

      <main>
        <section id="home" class="tab-content active">
          <div class="hero-section">
            <div class="input-wrapper">
              <div class="hero-left">
                <div class="typewriter" id="typewriter"></div>
                <div class="action-buttons">
                  <button id="toggleCameraBtn" class="action-btn live-camera">Live Camera</button>
                  <button id="uploadPhotoBtn" class="action-btn upload-photo">Upload Photo</button>
                  <input type="file" id="fileInput" accept="image/*" style="display: none" />
                </div>
                <div class="camera-section">
                  <div class="small-camera-window" id="cameraWrapper" style="display: none">
                    <video id="videoFeed" autoplay playsinline class="video-feed"></video>
                  </div>
                </div>
              </div>
              <div class="hero-right">
                <div class="typewriter-right" id="typewriterRight"></div>
              </div>
              <div id="caption" class="caption"></div>
            </div>

            <div class="result-wrapper">
              <div class="result-section" id="resultSection" style="display: none">
                <img id="resultImage" class="result-image" alt="Detection Result" />
                <div class="result-labels" id="resultLabels"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
